[project]
name = "backend"
version = "0.7.9"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.67",
    "celery>=5.6.3",
    "docling>=2.118.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "paddleocr[doc-parser]>=3.7.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-ai-slim[anthropic,google,openai]>=2.27.0",
    "pydantic-settings>=2",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "pymysql>=1.2.0",
    "python-json-logger>=4.1.0",
    "qdrant-client[fastembed]>=1.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "httpx>=0.28.1",
    "moto[s3]>=5.2.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Security() are designed to be used as argument
# defaults — this is the documented, idiomatic pattern, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
exclude = ["alembic/"]
