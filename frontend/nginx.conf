server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # SPA fallback — client-side routing (react-router) owns all non-file
    # paths, so unknown paths (e.g. /admin/rbac/users on a hard refresh)
    # must still resolve to index.html rather than a bare nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed build assets (Vite fingerprints
    # filenames), index.html itself is intentionally NOT cached so deploys
    # take effect immediately on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
